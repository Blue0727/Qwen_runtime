<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Qwen Runtime</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #f1f5f9;
      color: #1e293b;
      font: 15px/1.6 system-ui, "Microsoft YaHei", sans-serif;
    }

    .app {
      width: min(900px, 100%);
      height: 100vh;
      height: 100dvh;
      margin: auto;
      display: flex;
      flex-direction: column;
      background: white;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 18px 24px;
      border-bottom: 1px solid #e2e8f0;
    }

    h1 {
      margin: 0;
      font-size: 22px;
    }

    .hint {
      margin: 4px 0 0;
      color: #64748b;
      font-size: 13px;
    }

    .messages {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      padding: 24px;
    }

    .messages:empty::before {
      content: "输入一段文字，让模型继续写下去。";
      display: block;
      margin-top: 60px;
      text-align: center;
      color: #64748b;
    }

    .message {
      width: fit-content;
      max-width: 90%;
      margin-bottom: 20px;
      padding: 12px 16px;
      border-radius: 12px;
      background: #f1f5f9;
    }

    .message.user {
      margin-left: auto;
      background: #e8efff;
    }

    .message.error {
      background: #fff1f2;
      color: #9f1239;
    }

    .author,
    .meta {
      color: #64748b;
      font-size: 12px;
    }

    .author {
      margin-bottom: 6px;
      font-weight: 600;
    }

    .content {
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .meta {
      margin-top: 8px;
    }

    form {
      padding: 16px 24px;
      border-top: 1px solid #e2e8f0;
    }

    button,
    select,
    textarea {
      font: inherit;
    }

    textarea {
      display: block;
      width: 100%;
      min-height: 90px;
      max-height: 180px;
      resize: vertical;
      padding: 12px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
    }

    textarea:focus {
      outline: 2px solid #93c5fd;
      outline-offset: 1px;
    }

    .controls {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-top: 12px;
    }

    button,
    select {
      padding: 7px 12px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      background: white;
    }

    button {
      cursor: pointer;
    }

    #send {
      border-color: #2563eb;
      background: #2563eb;
      color: white;
    }

    button:disabled {
      opacity: 0.55;
      cursor: wait;
    }
  </style>
</head>

<body>
  <main class="app">
    <header>
      <div>
        <h1>Qwen Runtime</h1>
        <p class="hint">Qwen2.5-0.5B Base · 本地单轮续写</p>
      </div>
      <button id="clear" type="button">清空记录</button>
    </header>

    <section
      id="messages"
      class="messages"
      role="log"
      aria-live="polite"
      aria-label="生成记录"
    ></section>

    <form id="chat-form">
      <textarea
        id="prompt"
        aria-label="输入待续写的文字"
        placeholder="例如：The capital of France is"
        required
      ></textarea>

      <div class="controls">
        <label>
          最多生成
          <select id="max-tokens">
            <option value="16">16</option>
            <option value="64">64</option>
            <option value="128" selected>128</option>
            <option value="256">256</option>
          </select>
          token
        </label>

        <button id="send" type="submit">发送</button>
      </div>

      <p class="hint">
        Enter 发送 · Shift+Enter 换行 · 每次仅使用当前输入
      </p>
    </form>
  </main>

  <script>
    const chatForm = document.getElementById("chat-form");
    const messages = document.getElementById("messages");
    const promptInput = document.getElementById("prompt");
    const tokenSelect = document.getElementById("max-tokens");
    const sendButton = document.getElementById("send");
    const clearButton = document.getElementById("clear");

    let generating = false;

    // 统一管理等待状态，阻止同一页面重复提交。
    function setBusy(value) {
      generating = value;

      for (const control of [
        promptInput, tokenSelect, sendButton, clearButton
      ]) {
        control.disabled = value;
      }

      sendButton.textContent = value ? "生成中…" : "发送";
    }

    // 将文字作为纯文本插入页面，保留输入和输出的换行。
    function appendMessage(role, text) {
      const article = document.createElement("article");
      article.className = `message ${role}`;

      const author = document.createElement("div");
      author.className = "author";
      author.textContent = role === "user" ? "你" : "模型续写";

      const content = document.createElement("div");
      content.className = "content";
      content.textContent = text;

      article.append(author, content);
      messages.append(article);
      messages.scrollTop = messages.scrollHeight;

      return { article, content };
    }

    async function sendMessage(event) {
      // 阻止表单提交导致整个页面刷新。
      event.preventDefault();

      const text = promptInput.value;

      if (generating || !text.trim()) {
        return;
      }

      appendMessage("user", text);
      const reply = appendMessage("assistant", "正在生成…");

      const maxNewTokens = Number(tokenSelect.value);
      setBusy(true);

      try {
        const response = await fetch("/generate", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            text: text,
            max_new_tokens: maxNewTokens
          })
        });

        const data = await response.json().catch(() => null);

        // HTTP 错误也会正常返回 response，需要主动检查状态。
        if (!response.ok) {
          const detail = typeof data?.detail === "string"
            ? data.detail
            : `请求失败（HTTP ${response.status}）`;

          throw new Error(detail);
        }

        if (!data) {
          throw new Error("服务返回了无效响应");
        }

        reply.content.textContent =
          data.text || "（本次没有可显示的续写文本）";

        const meta = document.createElement("div");
        meta.className = "meta";
        meta.textContent =
          `输入 ${data.prompt_tokens} token · ` +
          `新增 ${data.generated_tokens} token`;

        reply.article.append(meta);

        // 成功后清空；失败时保留输入，便于修改后重试。
        promptInput.value = "";
      } catch (error) {
        reply.article.classList.add("error");
        reply.content.textContent = error instanceof TypeError
          ? "无法连接服务，请确认 Python 服务仍在运行。"
          : `生成失败：${error.message}`;
      } finally {
        setBusy(false);
        promptInput.focus();
        messages.scrollTop = messages.scrollHeight;
      }
    }

    chatForm.addEventListener("submit", sendMessage);

    promptInput.addEventListener("keydown", (event) => {
      // 中文输入法选字期间，Enter 不触发发送。
      if (
        event.key === "Enter" &&
        !event.shiftKey &&
        !event.isComposing
      ) {
        event.preventDefault();
        chatForm.requestSubmit();
      }
    });

    clearButton.addEventListener("click", () => {
      messages.replaceChildren();
      promptInput.focus();
    });
  </script>
</body>
</html>
